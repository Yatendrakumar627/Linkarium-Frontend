<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradients: Jet Black & Royal Amethyst core -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#3b0a6b" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#190433" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#050505" stop-opacity="1" />
    </radialGradient>

    <!-- Outer Rim Stroke Gradient: Electric Cyan to Royal Amethyst -->
    <linearGradient id="rim-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="25%" stop-color="#6a18b8" stop-opacity="0.75" />
      <stop offset="70%" stop-color="#00e5ff" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15" />
    </linearGradient>

    <!-- Inner Ambient Nebula Bloom -->
    <radialGradient id="nebula-purple" cx="30%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#3b0a6b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#3b0a6b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nebula-cyan" cx="70%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0" />
    </radialGradient>

    <!-- Infinity Link Main Gradient: Electric Cyan into Royal Amethyst -->
    <linearGradient id="link-neon" x1="10%" y1="20%" x2="90%" y2="80%">
      <stop offset="0%" stop-color="#8425f3" />
      <stop offset="35%" stop-color="#3b0a6b" />
      <stop offset="65%" stop-color="#00a8cc" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>

    <!-- Inner Core Specular Highlight -->
    <linearGradient id="core-highlight" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#f3e8ff" stop-opacity="0.75" />
      <stop offset="60%" stop-color="#e0e7ff" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#cffafe" stop-opacity="0.85" />
    </linearGradient>

    <!-- Top Glass Sheen -->
    <linearGradient id="top-sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="deep-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28" result="blur" />
    </filter>

    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect
    x="20"
    y="20"
    width="472"
    height="472"
    rx="118"
    fill="url(#bg-glow)"
    filter="url(#drop-shadow)"
  />

  <!-- Subtle Cosmic Nebula Background -->
  <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#nebula-purple)" />
  <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#nebula-cyan)" />

  <!-- Glass Inner Sheen (Top Half) -->
  <rect x="22" y="22" width="468" height="234" rx="116" fill="url(#top-sheen)" />

  <!-- Cosmic Stars / Distant Stellar Dust -->
  <circle cx="106" cy="118" r="1.8" fill="#ffffff" opacity="0.4" />
  <circle cx="396" cy="132" r="2.2" fill="#38bdf8" opacity="0.6" />
  <circle cx="410" cy="380" r="1.5" fill="#c084fc" opacity="0.5" />
  <circle cx="112" cy="392" r="2" fill="#ffffff" opacity="0.45" />
  <circle cx="256" cy="94" r="1.6" fill="#a855f7" opacity="0.5" />
  <circle cx="256" cy="418" r="1.8" fill="#06b6d4" opacity="0.4" />

  <!-- Ambient Glow Behind Infinity Loop -->
  <g filter="url(#deep-glow)" opacity="0.85">
    <path
      d="M 256,256 C 210,170 144,170 144,256 C 144,342 210,342 256,256 C 302,170 368,170 368,256 C 368,342 302,342 256,256 Z"
      fill="none"
      stroke="url(#link-neon)"
      stroke-width="72"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- The Main Interconnected Cosmic Infinity Link -->
  <!-- Layer 1: Background Loop Stroke (Full Infinity Ribbon) -->
  <path
    d="M 256,256 C 210,170 144,170 144,256 C 144,342 210,342 256,256 C 302,170 368,170 368,256 C 368,342 302,342 256,256 Z"
    fill="none"
    stroke="url(#link-neon)"
    stroke-width="58"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#neon-glow)"
  />

  <!-- Layer 2: 3D Shading Depth Ring -->
  <path
    d="M 256,256 C 210,170 144,170 144,256 C 144,342 210,342 256,256 C 302,170 368,170 368,256 C 368,342 302,342 256,256 Z"
    fill="none"
    stroke="#09071c"
    stroke-opacity="0.28"
    stroke-width="36"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Layer 3: Inner Core Filament (Electric Light Beam) -->
  <path
    d="M 256,256 C 210,170 144,170 144,256 C 144,342 210,342 256,256 C 302,170 368,170 368,256 C 368,342 302,342 256,256 Z"
    fill="none"
    stroke="url(#core-highlight)"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Layer 4: Precision Interlocking Overlap (Top-Left to Bottom-Right Weave) -->
  <!-- Shadow of the crossing strand -->
  <path
    d="M 218,206 C 238,232 256,256 276,280"
    fill="none"
    stroke="#020108"
    stroke-width="66"
    stroke-linecap="round"
    opacity="0.75"
  />
  <!-- Top Crossing Strand Outer Ribbon -->
  <path
    d="M 214,200 C 236,230 256,256 278,284"
    fill="none"
    stroke="url(#link-neon)"
    stroke-width="58"
    stroke-linecap="round"
    filter="url(#neon-glow)"
  />
  <!-- Top Crossing Strand Core Highlight -->
  <path
    d="M 214,200 C 236,230 256,256 278,284"
    fill="none"
    stroke="url(#core-highlight)"
    stroke-width="14"
    stroke-linecap="round"
  />

  <!-- Central Stellar Glint / Star Node at the Convergence -->
  <g transform="translate(256, 256)">
    <!-- Radial Star Bloom -->
    <circle cx="0" cy="0" r="18" fill="#ffffff" opacity="0.25" filter="url(#neon-glow)" />
    <!-- 4-Point Star Glint -->
    <path
      d="M 0,-24 Q 0,0 24,0 Q 0,0 0,24 Q 0,0 -24,0 Q 0,0 0,-24 Z"
      fill="#ffffff"
      opacity="0.9"
    />
    <circle cx="0" cy="0" r="4.5" fill="#ffffff" />
  </g>

  <!-- Orbital Micro-Nodes (representing connected bookmarks in orbit) -->
  <circle cx="144" cy="256" r="6.5" fill="#ffffff" filter="url(#neon-glow)" />
  <circle cx="144" cy="256" r="3.5" fill="#e0e7ff" />

  <circle cx="368" cy="256" r="6.5" fill="#ffffff" filter="url(#neon-glow)" />
  <circle cx="368" cy="256" r="3.5" fill="#cffafe" />

  <!-- Outer Precision Rim Stroke (Highest Z-index for crisp luxury edge) -->
  <rect
    x="20"
    y="20"
    width="472"
    height="472"
    rx="118"
    fill="none"
    stroke="url(#rim-grad)"
    stroke-width="3.5"
  />
</svg>